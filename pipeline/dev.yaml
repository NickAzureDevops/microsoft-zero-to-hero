trigger:
- main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: apply
    displayName: Apply
    type: boolean
    default: true
  - name: destroy
    displayName: Destroy
    type: boolean
    default: false

variables: 
  - name: workingDirectory
    value: "$(System.DefaultWorkingDirectory)/terraform/"
  - name: backendAzureRmKey
    value: 'microsoft-zero-hero.tfstate'
  - name: backendAzureRmResourceGroupName
    value: 'terraform-tfstate-rg'
  - name: backendAzureRmStorageAccountName
    value: 'terraformstatesbox'
  - name: backendAzureRmContainerName
    value: 'tfstate'
  - name: serviceConnection 
    value: 'OldSP'

stages:
- stage: validate
  displayName: 'Validate'
  jobs:
    - job: Validate
      steps:
      - checkout: self
        clean: true

      - task: TerraformInstaller@1
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: 'latest'

      - task: TerraformTaskV4@4
        displayName: 'terraform init'
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(workingDirectory)'
          backendServiceArm: '$(serviceConnection)'
          backendAzureRmResourceGroupName: '$(backendAzureRmResourceGroupName)'
          backendAzureRmStorageAccountName: '$(backendAzureRmStorageAccountName)'
          backendAzureRmContainerName: '$(backendAzureRmContainerName)'
          backendAzureRmKey: '$(backendAzureRmKey)'
        env:
          ARM_USE_AZUREAD: true

      - task: TerraformTaskV4@4
        displayName: 'terraform validate'
        inputs:
          provider: 'azurerm'
          command: 'validate'
          workingDirectory: '$(workingDirectory)'
        env:
          ARM_USE_AZUREAD: true
      
      - task: TerraformTaskV4@4
        displayName: 'terraform plan'
        condition: or(and(succeeded(), eq('${{ parameters.apply }}', 'true')), and(succeeded(), eq('${{ parameters.apply }}', 'false'), eq('${{ parameters.destroy }}', 'false')))
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: "${{ variables.workingDirectory }}"
          environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
        env:
          ARM_USE_AZUREAD: true

- stage: deploy
  displayName: 'Deploy'
  dependsOn:
  - validate
  jobs:
    - job: 'Deploy'
      steps:
      - checkout: self
        clean: true
      
      - task: TerraformInstaller@1
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: 'latest'

      - task: TerraformTaskV4@4
        displayName: 'terraform apply'
        condition: and(succeeded(), eq('${{ parameters.apply }}', 'true'))
        inputs:
          provider: 'azurerm'
          command: 'apply'
          workingDirectory: '$(workingDirectory)'
          environmentServiceNameAzureRM: '$(serviceConnection)'
        env:
          ARM_USE_AZUREAD: true

      - task: TerraformTaskV4@4
        displayName: 'terraform destroy'
        condition: and(succeeded(), eq('${{ parameters.destroy }}', 'true'))
        inputs:
          provider: 'azurerm'
          command: 'destroy'
          workingDirectory: '$(workingDirectory)'
          environmentServiceNameAzureRM: '$(serviceConnection)'
        env:
          ARM_USE_AZUREAD: true